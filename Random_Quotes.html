<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Quote Generator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f5f5;
}

.container{
    width:600px;
    background:white;
    padding:40px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
    text-align:center;
}

h1{
    margin-bottom:30px;
}

#quote{
    font-size:24px;
    font-style:italic;
    margin-bottom:20px;
    min-height:90px;
}

#author{
    margin-bottom:30px;
    color:#666;
}

button{
    padding:14px 24px;
    border:none;
    border-radius:8px;
    background:#0092cc;
    color:white;
    cursor:pointer;
}
</style>

</head>
<body>

<div class="container">

<h1>Random Quote Generator</h1>

<p id="quote">Click the button to generate a quote.</p>

<h3 id="author"></h3>

<button id="btn">New Quote</button>

</div>

<script>

const quotes = [
{
quote:"The best way to get started is to quit talking and begin doing.",
author:"Walt Disney"
},
{
quote:"Success is not final, failure is not fatal: it is the courage to continue that counts.",
author:"Winston Churchill"
},
{
quote:"Dream big and dare to fail.",
author:"Norman Vaughan"
},
{
quote:"Don't watch the clock; do what it does. Keep going.",
author:"Sam Levenson"
},
{
quote:"Believe you can and you're halfway there.",
author:"Theodore Roosevelt"
},
{
quote:"Small progress is still progress.",
author:"Unknown"
},
{
quote:"Your only limit is your mind.",
author:"Unknown"
},
{
quote:"Discipline beats motivation.",
author:"Unknown"
},
{
quote:"Consistency creates results.",
author:"Unknown"
},
{
quote:"Every expert was once a beginner.",
author:"Helen Hayes"
}
];

const btn = document.querySelector("#btn");
const quote = document.querySelector("#quote");
const author = document.querySelector("#author");

let previousIndex = -1;

function generateQuote(){

    let randomIndex;

    do{
        randomIndex = Math.floor(Math.random() * quotes.length);
    }while(randomIndex === previousIndex);

    previousIndex = randomIndex;

    const currentQuote = quotes[randomIndex];

    quote.textContent = currentQuote.quote;
    author.textContent = `- ${currentQuote.author}`;

}

btn.addEventListener("click", generateQuote);

document.addEventListener("keydown",(e)=>{

    if(e.key === "Enter"){
        generateQuote();
    }

});

</script>

</body>
</html>
