<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character & Word Counter</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #faebb3, #f8cb00);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 2rem;
        }

        textarea {
            width: 100%;
            height: 220px;
            resize: none;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            transition: .3s;
        }

        textarea:focus {
            border-color: #e3b808;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.3);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 15px;
        }

        .card {
            flex: 1;
            background: #f4f4f4;
            padding: 18px;
            border-radius: 10px;
            text-align: center;
        }

        .card h2 {
            font-size: 2rem;
            color: #ffae00;
            margin-bottom: 5px;
        }

        .card p {
            color: #555;
            font-size: 15px;
        }

        @media(max-width:500px) {
            .stats {
                flex-direction: column;
            }

            h1 {
                font-size: 1.7rem;
            }

            textarea {
                height: 180px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Character & Word Counter</h1>

        <textarea id="input" placeholder="Start typing here..."></textarea>

        <div class="stats">
            <div class="card">
                <h2 id="charCount">0</h2>
                <p>Characters</p>
            </div>

            <div class="card">
                <h2 id="wordCount">0</h2>
                <p>Words</p>
            </div>
        </div>
    </div>

    <script>
        let input = document.querySelector("#input");
        let charCount = document.querySelector("#charCount");
        let wordCount = document.querySelector("#wordCount");

        input.addEventListener("input", function () {

            let value = input.value.trim();

            charCount.textContent = value.length;

            if (value === "") {
                wordCount.textContent = 0;
            } else {
                let words = value.split(/\s+/);
                wordCount.textContent = words.length;
            }

        });
    </script>

</body>

</html>
