<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }

        .container {
            width: 450px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .input-box {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            background: #0077ff;
            color: white;
        }

        ul {
            list-style: none;
            margin-top: 20px;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 10px;
            background: #eee;
            border-radius: 6px;
            cursor: pointer;
        }

        .done {
            background: rgb(177,245,152);
            text-decoration: line-through;
            opacity: .6;
        }

    </style>
</head>
<body>

<div class="container">

    <h1>Todo App</h1>

    <div class="input-box">
        <input type="text" id="todo" placeholder="Enter a task">
        <button id="addBtn">Add</button>
    </div>

    <ul id="list"></ul>

</div>

<script>

const input = document.querySelector("#todo");
const addBtn = document.querySelector("#addBtn");
const list = document.querySelector("#list");

// Load tasks
let tasks = JSON.parse(localStorage.getItem("arr")) || [];

// Display Tasks
function display(){

    list.innerHTML = "";

    tasks.forEach((task,index)=>{

        let li = document.createElement("li");
        li.textContent = task;

        // Complete Task
        li.addEventListener("click",()=>{

            li.classList.toggle("done");

        });

        // Delete Task
        li.addEventListener("dblclick",()=>{

            tasks.splice(index,1);

            localStorage.setItem("arr",JSON.stringify(tasks));

            display();

        });

        list.appendChild(li);

    });

}

// Add Task
addBtn.addEventListener("click",()=>{

    let value = input.value.trim();

    if(value === ""){
        alert("Please enter a task");
        return;
    }

    tasks.push(value);

    localStorage.setItem("arr",JSON.stringify(tasks));

    display();

    input.value = "";

});

// Show saved tasks when page loads
display();

</script>

</body>
</html>
