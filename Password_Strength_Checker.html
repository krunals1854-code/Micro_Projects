<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }

        .container {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .input-box {
            position: relative;
        }

        input {
            width: 100%;
            padding: 14px;
            padding-right: 80px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
        }

        button {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: #4f46e5;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .bar {
            width: 100%;
            height: 10px;
            background: #ddd;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 20px;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: red;
            transition: .5s;
        }

        .strength {
            margin-top: 15px;
            font-weight: bold;
        }

        .rules {
            margin-top: 20px;
        }

        .rules p {
            margin: 8px 0;
            color: red;
        }

        .valid {
            color: green !important;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Password Checker</h1>

        <div class="input-box">
            <input type="password" id="password" placeholder="Enter Password">
            <button id="toggleBtn">Show</button>
        </div>

        <div class="bar">
            <div class="progress" id="progress"></div>
        </div>

        <p class="strength" id="strength">Strength :</p>

        <div class="rules">
            <p id="c1">✔ At least 8 characters</p>
            <p id="c2">✔ One uppercase letter</p>
            <p id="c3">✔ One lowercase letter</p>
            <p id="c4">✔ One number</p>
            <p id="c5">✔ One special character</p>
        </div>

    </div>

    <script>
        //element selection
        const input = document.querySelector("#password");
        const toggleBtn = document.querySelector("#toggleBtn");
        const progress = document.querySelector("#progress");
        const strength = document.querySelector("#strength");

        //warnings selections
        const c1 = document.querySelector("#c1");
        const c2 = document.querySelector("#c2");
        const c3 = document.querySelector("#c3");
        const c4 = document.querySelector("#c4");
        const c5 = document.querySelector("#c5");

        //password Hide & show logic
        toggleBtn.addEventListener("click", () => {
            if (input.type === "password") {
                toggleBtn.textContent = "Show"
                input.type = "text"
            } else {
                toggleBtn.textContent = "Hide"
                input.type = "password"
            }
        })

        //input logic & warning checking
        input.addEventListener("input", () => {
            let value = input.value;
            let score = 0;

            check(value.length >= 8 , c1)
            check(/[A-Z]/.test(value), c2)
            check(/[a-z]/.test(value), c3)
            check(/[0-9]/.test(value), c4)
            check(/[!@#$%^&*]/.test(value), c5)

            function check(condition, element) {
                if (condition) {
                    score++
                    element.classList.add("valid")
                } else {
                    element.classList.remove("valid")
                }
            }
            
            //progress Bar, Strenght checker 
            progress.style.width = score * 20 + "%";

            if(score <= 2){
                progress.style.background = "red"
                strength.textContent = "Strength : Weak"

            }
            else if (score <=4){
                progress.style.background = "orange"
                strength.textContent = "Strength : Medium"

            }
            else{
                progress.style.background = "green"
                strength.textContent = "Strength : Strong"

            }

        })



    </script>

</body>

</html>
